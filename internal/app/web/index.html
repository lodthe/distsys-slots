<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Защиты · Распределённые системы</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">РС <span>ВШЭ · Распределённые системы</span></div>
        <div class="topline">
          <h1>Запись на защиту</h1>
          <button id="refresh" class="icon" aria-label="Обновить расписание">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7M20 12a8 8 0 0 0-2.3-5.7" />
            </svg>
          </button>
        </div>
        <div id="role-switch" hidden></div>
      </header>
      <nav id="nav" aria-label="Разделы" hidden></nav>
      <div id="notice" role="status" aria-live="polite"></div>
      <main id="content">
        <section class="card"><p>Загружаем расписание…</p></section>
      </main>
      <footer>Курс «Распределённые системы»</footer>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
  </body>
</html>
